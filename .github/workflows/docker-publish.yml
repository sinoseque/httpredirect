name: Build and Publish Multi-Arch Image

on:
  push:
    branches: [ "main" ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Configura QEMU para poder compilar para ARM64 en servidores AMD64 de GitHub
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      # Configura Buildx (necesario para multi-arch)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Docker tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tags=${{ secrets.DOCKER_USERNAME }}/httpredirect:${{ github.event.release.tag_name }},${{ secrets.DOCKER_USERNAME }}/httpredirect:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ secrets.DOCKER_USERNAME }}/httpredirect:edge" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Aquí defines las dos arquitecturas
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/httpredirect
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
